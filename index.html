<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calendário de Feiras Livres — Vale do Paraíba</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12244A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feiras VP">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --app-max-width:480px;
    --white:#FFFFFF; --page:#EEF2F8; --line:#E4EAF3; --line-soft:#EEF2F8;
    --ink:#161B29; --ink-soft:#6B7386; --navy:#04307C; --navy-2:#0B3F92;
    --blue:#0B57E0; --blue-mid:#0B4DB8; --blue-soft:#EAF1FF; --blue-pale:#F3F7FF;
    --amber:#B5680B; --red:#D93B3B; --tab-inactive:#93A3C4;
    --c-sjc:#2F6FED; --c-jac:#8B5CF6; --c-tau:#22C55E; --c-cac:#F97316;
    --c-apa:#14B8A6; --c-gta:#EC4899; --c-cjo:#0F766E; --c-atb:#EAB308;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--page); color:var(--ink); font-family:'IBM Plex Sans', sans-serif;}

  .shell{
    max-width:var(--app-max-width); margin:0 auto; min-height:100vh; background:var(--page);
    display:flex; flex-direction:column; position:relative;
    box-shadow:0 0 40px rgba(18,36,74,0.12);
  }

  /* ---------------- HEADER ---------------- */
  .app-header{
    background:linear-gradient(150deg, var(--navy), var(--navy-2) 70%);
    color:#fff; padding:18px 18px 26px 18px; position:relative; overflow:hidden;
  }
  .header-row{display:flex; align-items:flex-start; gap:14px; position:relative; z-index:2;}
  .app-icon{
    width:56px; height:56px; flex:none; border-radius:14px; background:var(--blue-mid);
    display:flex; align-items:center; justify-content:center; border:1.5px solid rgba(255,255,255,0.3);
  }
  .header-text h1{font-family:'IBM Plex Sans', sans-serif; font-weight:800; font-size:22px; line-height:1.15; margin:0; letter-spacing:-0.01em;}
  .header-text p{margin:4px 0 0 0; font-size:13px; color:#AFC2ED;}
  .header-deco{
    position:absolute; right:20px; top:50%; transform:translateY(-50%);
    width:125px; z-index:1; pointer-events:none;
  }
  @media (max-width:430px){ .header-deco{width:108px; right:16px;} }
  @media (max-width:389px){ .header-deco{width:92px; right:14px;} }
  @media (max-width:359px){ .header-deco{width:78px; right:12px;} }

  /* ---------------- FILTER TOOLBAR ---------------- */
  .toolbar{
    background:var(--white); margin:-16px 14px 0 14px; border-radius:20px;
    box-shadow:0 8px 24px rgba(18,36,74,0.10); padding:10px; position:relative; z-index:3;
    display:flex; gap:8px; overflow-x:auto;
  }
  .pill{
    flex:none; display:flex; align-items:center; gap:6px; border:1px solid var(--line);
    border-radius:999px; padding:8px 12px; background:#fff; position:relative;
  }
  .pill svg{flex:none;}
  .pill select{
    appearance:none; -webkit-appearance:none; border:none; background:transparent;
    font-family:'IBM Plex Sans', sans-serif; font-size:12.5px; font-weight:600; color:var(--blue);
    padding-right:14px; max-width:120px;
  }
  .pill.chev::after{
    content:""; position:absolute; right:10px; top:50%; width:6px; height:6px;
    border-right:1.5px solid var(--blue); border-bottom:1.5px solid var(--blue);
    transform:translateY(-65%) rotate(45deg); pointer-events:none;
  }
  .pill-report{
    background:var(--blue); color:#fff; border:none; font-family:'IBM Plex Sans', sans-serif;
    font-weight:600; font-size:12.5px; display:flex; align-items:center; gap:6px;
    border-radius:999px; padding:9px 14px; flex:none; cursor:pointer; white-space:nowrap;
  }
  .pill-report svg{flex:none;}

  /* ---------------- MAIN / CARDS ---------------- */
  main{flex:1; padding:16px 14px calc(76px + env(safe-area-inset-bottom)) 14px;}
  .card{background:var(--white); border-radius:20px; box-shadow:0 4px 16px rgba(18,36,74,0.06); padding:16px; margin-bottom:14px;}

  .cal-top{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px;}
  .cal-top h2{font-family:'IBM Plex Sans', sans-serif; font-weight:800; font-size:26px; margin:0; color:var(--ink);}
  .cal-top .yr{font-family:'IBM Plex Mono', monospace; font-weight:500; font-size:14px; color:var(--blue); margin-left:6px;}
  .cal-nav{display:flex; gap:6px;}
  .cal-nav button{width:32px; height:32px; border-radius:10px; border:none; background:var(--blue-soft); color:var(--blue); cursor:pointer; font-size:15px; font-weight:700;}
  .cal-nav button:hover{background:var(--blue-highlight, #DCE9FF);}

  .wk-head{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:4px;}
  .wk-head div{font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600; letter-spacing:.04em; color:var(--ink-soft); padding:4px 0;}
  .wk-head div.we{color:var(--red);}

  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .day{
    aspect-ratio:1/1; border-radius:8px; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; padding-top:6px; cursor:pointer; position:relative; background:transparent;
  }
  .day:hover{background:var(--blue-pale);}
  .day .n{font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:13px; color:var(--ink);}
  .day.out .n{color:#C7CEDC; font-weight:500;}
  .day.out{cursor:default;}
  .day.out:hover{background:transparent;}
  .day.we .n{color:var(--red);}
  .day.sa .n{color:var(--blue);}
  .day.today .n{background:var(--blue); color:#fff; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:12px;}
  .day.selected{outline:2px solid var(--blue); outline-offset:-2px; border-radius:8px;}
  .day .dots{display:flex; gap:2px; margin-top:4px; align-items:center;}
  .day .dots span.dot{width:5px; height:5px; border-radius:50%;}
  .day .dots .more{font-family:'IBM Plex Sans', sans-serif; font-size:8.5px; font-weight:600; color:var(--ink-soft); background:var(--line); border-radius:8px; padding:1px 4px; margin-left:2px; line-height:1.3;}
  .day .reg-mark{position:absolute; top:3px; right:5px; width:5px; height:5px; border-radius:50%; background:var(--amber);}

  .legend{display:grid; grid-template-columns:repeat(3,1fr); gap:10px 12px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line-soft);}
  .legend .lg{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .legend .dot{width:9px; height:9px; border-radius:50%; flex:none;}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; flex-wrap:wrap;}
  .section-head h3{font-family:'IBM Plex Sans', sans-serif; font-weight:700; font-size:17px; margin:0;}
  .section-head a{font-size:12.5px; color:var(--blue); text-decoration:none; font-weight:600; display:flex; align-items:center; gap:3px; cursor:pointer; white-space:nowrap;}
  .section-actions{display:flex; align-items:center; gap:14px;}
  .btn-novo-registro{
    background:var(--blue); color:#fff; border:none; font-family:'IBM Plex Sans', sans-serif;
    font-weight:700; font-size:12.5px; padding:8px 14px; border-radius:999px; cursor:pointer;
    white-space:nowrap; box-shadow:0 3px 8px rgba(11,87,224,0.28);
  }
  .btn-novo-registro:hover{background:var(--navy-2);}

  .ag-card{
    display:flex; align-items:center; gap:12px; background:#fff; box-shadow:0 2px 10px rgba(18,36,74,0.07);
    border-radius:16px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
  }
  .ag-card:hover{box-shadow:0 4px 14px rgba(18,36,74,0.12);}
  .ag-date{flex:none; width:52px; height:52px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ag-date .dd{font-family:'IBM Plex Sans', sans-serif; font-weight:800; font-size:17px; line-height:1;}
  .ag-date .mm{font-family:'IBM Plex Sans', sans-serif; font-weight:700; font-size:9px; text-transform:uppercase; margin-top:2px; letter-spacing:.03em;}
  .ag-main{flex:1; min-width:0;}
  .ag-main .city{display:flex; align-items:center; gap:6px; font-weight:700; font-size:13.5px; margin-bottom:3px;}
  .ag-main .city .dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .ag-meta{font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ag-meta svg{flex:none;}
  .ag-tag{flex:none; font-family:'IBM Plex Sans', sans-serif; font-size:11px; font-weight:700; padding:5px 10px; border-radius:8px;}
  .ag-chev{flex:none; color:var(--ink-soft); font-size:16px;}
  .ag-gcal{flex:none; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px;}
  .ag-gcal:hover{background:var(--blue-soft); color:var(--blue);}
  .ag-card.reg{box-shadow:0 2px 10px rgba(181,104,11,0.12);}
  .empty-note{font-size:13px; color:var(--ink-soft); padding:10px 2px;}

  .city-card{display:flex; align-items:center; gap:12px; background:#fff; box-shadow:0 2px 10px rgba(18,36,74,0.07); border-radius:16px; padding:12px 14px; margin-bottom:10px; cursor:pointer;}
  .city-card:hover{box-shadow:0 4px 14px rgba(18,36,74,0.12);}
  .city-swatch{width:38px; height:38px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:11px;}
  .city-info{flex:1;}
  .city-info .cn{font-weight:600; font-size:14px;}
  .city-info .cc{font-size:12px; color:var(--ink-soft); margin-top:1px;}

  .rep-presets{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .rep-presets button{
    font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    padding:8px 12px; border:1px solid var(--line); background:var(--blue-pale); color:var(--navy);
    border-radius:8px; cursor:pointer;
  }
  .rep-presets button.active{background:var(--blue); color:#fff; border-color:var(--blue);}
  .rep-day-head{font-family:'IBM Plex Sans', sans-serif; font-weight:700; font-size:14px; color:var(--navy); margin:14px 0 8px 0;}
  .btn-print{
    width:100%; background:var(--navy); color:#fff; border:none; font-family:'IBM Plex Sans', sans-serif;
    font-weight:600; font-size:13.5px; padding:12px; border-radius:10px; cursor:pointer; margin-top:6px;
  }

  /* ---------------- BOTTOM TABS ---------------- */
  .bottom-tabs{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%);
    width:100%; max-width:var(--app-max-width);
    display:grid; grid-template-columns:repeat(4,1fr);
    padding:10px 4px calc(10px + env(safe-area-inset-bottom)) 4px;
    background:#fff; border-top:1px solid rgba(0,0,0,.08);
    box-shadow:0 -6px 18px rgba(18,36,74,0.06);
    z-index:1000;
  }
  .tab-btn{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--tab-inactive); font-family:'IBM Plex Sans', sans-serif; font-weight:500; font-size:10.5px; cursor:pointer; padding:6px 2px;
  }
  .tab-btn.active{color:var(--blue); font-weight:700;}
  .tab-btn svg{flex:none;}

  .view{display:none;}
  .view.active{display:block;}

  /* ---------------- MODAL (popup do dia) ---------------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(18,36,74,0.55); display:none;
    align-items:flex-end; justify-content:center; z-index:1100;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    background:#fff; width:100%; max-width:var(--app-max-width); max-height:88vh; border-radius:18px 18px 0 0;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-card .mhead{background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .modal-card .mhead h3{font-family:'IBM Plex Sans', sans-serif; font-weight:700; font-size:15px; margin:0;}
  .mhead-actions{display:flex; gap:6px;}
  .modal-card .mhead button{background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff; font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; padding:6px 9px; border-radius:6px; cursor:pointer;}
  .modal-body{padding:16px 18px 24px 18px; overflow-y:auto;}
  .modal-body h4{font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--blue); margin:16px 0 8px 0;}
  .modal-body h4:first-child{margin-top:0;}

  .feira-item{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:12.8px;}
  .feira-item:last-child{border-bottom:none;}
  .feira-item .fi-main strong{color:var(--navy); font-family:'IBM Plex Sans', sans-serif;}
  .feira-item .fi-main span{display:block; color:var(--ink-soft); font-size:11.3px; margin-top:2px;}
  .feira-item button{flex:none; font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; background:var(--blue-soft); border:1px solid var(--line); color:var(--navy); padding:5px 8px; border-radius:6px; cursor:pointer; white-space:nowrap;}
  .gcal-link-inline{flex:none; font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; background:#fff; border:1px solid var(--line); color:var(--blue); padding:5px 8px; border-radius:6px; white-space:nowrap;}
  .fi-actions{display:flex; gap:6px; flex:none;}

  .reg-card{border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:8px; padding:10px 12px; margin-bottom:10px; background:#FFFBF4;}
  .reg-card .rc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .reg-card .rc-tipo{font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--amber); background:#FFF0D9; padding:2px 6px; border-radius:2px; display:inline-block; margin-bottom:5px;}
  .reg-card .rc-title{font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:13.5px; color:var(--ink);}
  .reg-card .rc-meta{font-size:11.8px; color:var(--ink-soft); margin-top:4px; line-height:1.5;}
  .reg-card .rc-actions{display:flex; gap:6px; flex:none;}
  .reg-card .rc-actions button{font-family:'IBM Plex Mono', monospace; font-size:10px; border:1px solid var(--line); background:#fff; padding:4px 7px; border-radius:6px; cursor:pointer; color:var(--ink-soft);}
  .reg-card .rc-actions .gcal-link{font-family:'IBM Plex Mono', monospace; font-size:10px; border:1px solid var(--line); background:#fff; padding:4px 7px; border-radius:6px; color:var(--blue); text-decoration:none; white-space:nowrap;}

  .form-registro{border-top:1px solid var(--line); padding-top:16px; margin-top:6px;}
  .frow{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
  .form-registro input, .form-registro select, .form-registro textarea{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:13px; padding:9px 10px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); margin-bottom:8px;
  }
  .form-registro textarea{min-height:52px; resize:vertical;}
  .form-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .btn-primary{background:var(--blue); color:#fff; border:none; font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:13px; padding:10px 18px; border-radius:8px; cursor:pointer;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink-soft); font-family:'IBM Plex Sans', sans-serif; font-size:13px; padding:10px 14px; border-radius:8px; cursor:pointer;}
  .form-msg{font-size:12px; color:var(--ink-soft);}
  .form-msg.ok{color:#2E7D32;}
  .form-msg.err{color:#B3261E;}
  .loading-txt{font-size:12.5px; color:var(--ink-soft); font-style:italic;}
  .empty-note-sm{font-size:12.5px; color:var(--ink-soft);}

  /* ---------------- PRINT ---------------- */
  #printArea{display:none;}
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;}
    .pa-page{padding:14mm;}
  }
  .pa-title{font-family:'IBM Plex Sans', sans-serif; font-weight:800; font-size:24px; color:#12244A; margin:0 0 2px 0;}
  .pa-sub{font-family:'IBM Plex Mono', monospace; font-size:11px; color:#5B6577; margin-bottom:16px; text-transform:uppercase; letter-spacing:.06em;}
  .pa-row{display:grid; grid-template-columns:90px 1fr; gap:10px; padding:6px 0; border-bottom:1px dotted #D9E4F5; font-size:12.5px;}
  .pa-row .pa-h{font-family:'IBM Plex Mono', monospace; color:#12244A; font-weight:600;}
  .pa-row .pa-b strong{display:block;}
  .pa-row .pa-b span{display:block; color:#5B6577; font-size:11px; margin-top:1px;}
  .pa-day-block h6{font-family:'IBM Plex Sans', sans-serif; font-size:14px; font-weight:600; margin:14px 0 4px 0; color:#12244A;}
  .pa-empty{font-size:12px; color:#5B6577; font-style:italic;}
</style>
</head>
<body>

<div class="shell">

  <header class="app-header">
    <div class="header-row">
      <div class="app-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4 9L5.5 4h13L20 9" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 9c0 1.4 1.1 2.5 2.4 2.5S8.8 10.4 8.8 9c0 1.4 1.2 2.5 2.6 2.5S14 10.4 14 9c0 1.4 1.2 2.5 2.6 2.5S19.2 10.4 19.2 9" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11.5V20h14v-8.5" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 20v-5a2.5 2.5 0 0 1 5 0v5" stroke="#fff" stroke-width="1.6"/></svg>
      </div>
      <div class="header-text">
        <h1>Calendário de<br>Feiras Livres</h1>
        <p>Vale do Paraíba</p>
      </div>
    </div>
    <svg class="header-deco" width="150" height="130" viewBox="0 0 150 130" fill="none">
      <path d="M18 78 Q6 58 22 40 Q26 18 52 16 Q68 4 92 14 Q118 8 130 28 Q148 32 143 54 Q152 72 132 84 Q128 106 101 100 Q80 114 58 100 Q34 106 23 90 Q8 92 18 78Z" fill="#5C8DF2" opacity="0.24"/>
      <circle cx="48" cy="52" r="2.6" fill="#fff" opacity="0.5"/>
      <circle cx="100" cy="66" r="2.2" fill="#fff" opacity="0.4"/>
      <circle cx="70" cy="88" r="2.2" fill="#fff" opacity="0.4"/>
      <circle cx="82" cy="52" r="27" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="1.3"/>
      <path d="M82 37c-9 0-14.5 7.6-14.5 14.5 0 10 14.5 24 14.5 24s14.5-14 14.5-24C96.5 44.6 91 37 82 37Z" fill="#fff"/>
      <circle cx="82" cy="51.5" r="5.4" fill="#04307C"/>
    </svg>
  </header>

  <div class="toolbar">
    <div class="pill chev">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22Z" stroke="#0B57E0" stroke-width="1.7"/><circle cx="12" cy="9.5" r="2.4" stroke="#0B57E0" stroke-width="1.7"/></svg>
      <select id="selCidade"></select>
    </div>
    <div class="pill chev">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="16" rx="2.4" stroke="#0B57E0" stroke-width="1.7"/><path d="M3.5 9.5h17M8 3v3.4M16 3v3.4" stroke="#0B57E0" stroke-width="1.7" stroke-linecap="round"/></svg>
      <select id="selDia"></select>
    </div>
    <div class="pill chev">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#0B57E0" stroke-width="1.7"/><path d="M12 7.5V12l3 2" stroke="#0B57E0" stroke-width="1.7" stroke-linecap="round"/></svg>
      <select id="selFeira"></select>
    </div>
    <button class="pill-report" id="btnGoReport">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 20V11M12 20V4M19 20v-7" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      Relatório da agenda
    </button>
  </div>

  <main>

    <section id="view-calendario" class="view active">

// Fallback em memória: usado só se o navegador bloquear localStorage (ex.: modo privado).
// Os dados continuam disponíveis durante a sessão, mas não persistem após fechar a aba.
const memStore = {};

function dayKey(y,m,d){ return `evt:${y}-${m}-${d}`; }
function lsAvailable(){
  try{ const t='__lstest__'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return true; }
  catch(e){ return false; }
}
async function loadDayRegs(y,m,d){
  const key = dayKey(y,m,d);
  if(!lsAvailable()){ return memStore[key] ? JSON.parse(JSON.stringify(memStore[key])) : []; }
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : []; }
  catch(e){ return memStore[key] ? JSON.parse(JSON.stringify(memStore[key])) : []; }
}
async function saveDayRegs(y,m,d,list){
  const key = dayKey(y,m,d);
  if(!lsAvailable()){
    memStore[key] = list;
    if(!storageWarned){ storageWarned = true; console.warn('localStorage indisponível — usando memória apenas para esta sessão.'); }
    return true;
  }
  try{ localStorage.setItem(key, JSON.stringify(list)); return true; }
  catch(e){
    console.error('Falha ao salvar no localStorage:', e);
    memStore[key] = list;
    return true;
  }
}
function regCountForDay(y,m,d){
  const key = dayKey(y,m,d);
  if(!lsAvailable()){ return memStore[key] ? memStore[key].length : 0; }
  try{ const v = localStorage.getItem(key); if(!v) return 0; const arr=JSON.parse(v); return Array.isArray(arr)?arr.length:0; }
  catch(e){ return memStore[key] ? memStore[key].length : 0; }
}
function getDayRegsSync(y,m,d){
  const key = dayKey(y,m,d);
  if(!lsAvailable()){ return memStore[key] || []; }
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : (memStore[key]||[]); }
  catch(e){ return memStore[key] || []; }
}
async function loadRegsForRange(start,end){
  const regsByDay = {};
  const useLs = lsAvailable();
  const months = new Set();
  eachDate(start,end).forEach(d=>months.add(`${d.getFullYear()}-${d.getMonth()}`));
  if(useLs){
    months.forEach(key=>{
      const prefix = `evt:${key}-`;
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(prefix)===0){
          try{ const v = localStorage.getItem(k); if(v) regsByDay[k.replace('evt:','')] = JSON.parse(v); }catch(e){}
        }
      }
    });
  }
  Object.keys(memStore).forEach(k=>{
    if(memStore[k] && memStore[k].length){ regsByDay[k.replace('evt:','')] = memStore[k]; }
  });
  return regsByDay;
}

function sameDay(a,b){ return a.toDateString()===b.toDateString(); }
function eachDate(start,end){ const arr=[]; const d=new Date(start); while(d<=end){ arr.push(new Date(d)); d.setDate(d.getDate()+1); } return arr; }

// ---------- integração com Google Agenda ----------
function pad2(n){ return String(n).padStart(2,'0'); }
function parseHorario(s){
  if(!s) return null;
  const matches = [...String(s).matchAll(/(\d{1,2})h(\d{2})?/g)];
  if(!matches.length) return null;
  const startH = parseInt(matches[0][1]), startM = matches[0][2]?parseInt(matches[0][2]):0;
  let endH = startH+1, endM = startM;
  if(matches.length>=2){
    endH = parseInt(matches[1][1]);
    endM = matches[1][2]?parseInt(matches[1][2]):0;
  }
  return {startH,startM,endH,endM};
}
function googleCalendarLink(title, dateObj, horario, location, details, email){
  const parsed = parseHorario(horario);
  const y=dateObj.getFullYear(), mo=dateObj.getMonth(), d=dateObj.getDate();
  let datesParam;
  if(parsed){
    const s = `${y}${pad2(mo+1)}${pad2(d)}T${pad2(parsed.startH)}${pad2(parsed.startM)}00`;
    const e = `${y}${pad2(mo+1)}${pad2(d)}T${pad2(parsed.endH)}${pad2(parsed.endM)}00`;
    datesParam = `${s}/${e}`;
  } else {
    const nd = new Date(y,mo,d+1);
    const fdA = `${y}${pad2(mo+1)}${pad2(d)}`;
    const fdB = `${nd.getFullYear()}${pad2(nd.getMonth()+1)}${pad2(nd.getDate())}`;
    datesParam = `${fdA}/${fdB}`;
  }
  const paramsObj = {
    action:'TEMPLATE', text:title, dates:datesParam,
    details: details||'', location: location||'', ctz:'America/Sao_Paulo'
  };
  const params = new URLSearchParams(paramsObj);
  if(email){
    String(email).split(/[,;]/).map(s=>s.trim()).filter(Boolean).forEach(em=> params.append('add', em));
  }
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
function escapeAttr(s){ return String(s==null?"":s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function gcalTriggerAttrs(title, dateObj, horario, location, details, email){
  const y=dateObj.getFullYear(), m=dateObj.getMonth(), d=dateObj.getDate();
  return `href="#" data-title="${escapeAttr(title)}" data-date="${y}-${m}-${d}" data-horario="${escapeAttr(horario)}" data-local="${escapeAttr(location)}" data-details="${escapeAttr(details)}" data-email="${escapeAttr(email||'')}"`;
}
// Delegação global: clicar em qualquer elemento .gcal-trigger pede o(s) e-mail(s) do(s) convidado(s)
// antes de abrir o Google Agenda já com esses convidados prontos para receber o evento.
document.addEventListener('click', function(ev){
  const el = ev.target.closest('.gcal-trigger');
  if(!el) return;
  ev.preventDefault();
  ev.stopPropagation();
  const parts = el.dataset.date.split('-').map(Number);
  const dateObj = new Date(parts[0], parts[1], parts[2]);
  const existing = el.dataset.email || '';
  const input = window.prompt('Convidar por e-mail no Google Agenda — separe vários por vírgula (a pessoa recebe o convite para aceitar). Deixe em branco para não convidar ninguém agora:', existing);
  if(input === null) return; // cancelou
  const url = googleCalendarLink(el.dataset.title, dateObj, el.dataset.horario, el.dataset.local, el.dataset.details, input.trim());
  window.open(url, '_blank', 'noopener');
});
function icsEscape(s){ return String(s||"").replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function buildICS(events){
  let ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Feiras Vale do Paraiba//PT-BR\r\nCALSCALE:GREGORIAN\r\n";
  events.forEach(e=>{
    const parsed = parseHorario(e.horario);
    const y=e.dateObj.getFullYear(), mo=e.dateObj.getMonth(), d=e.dateObj.getDate();
    let dtStartLine, dtEndLine;
    if(parsed){
      const s = `${y}${pad2(mo+1)}${pad2(d)}T${pad2(parsed.startH)}${pad2(parsed.startM)}00`;
      const en = `${y}${pad2(mo+1)}${pad2(d)}T${pad2(parsed.endH)}${pad2(parsed.endM)}00`;
      dtStartLine = `DTSTART;TZID=America/Sao_Paulo:${s}`;
      dtEndLine = `DTEND;TZID=America/Sao_Paulo:${en}`;
    } else {
      const nd = new Date(y,mo,d+1);
      dtStartLine = `DTSTART;VALUE=DATE:${y}${pad2(mo+1)}${pad2(d)}`;
      dtEndLine = `DTEND;VALUE=DATE:${nd.getFullYear()}${pad2(nd.getMonth()+1)}${pad2(nd.getDate())}`;
    }
    ics += "BEGIN:VEVENT\r\n";
    ics += `UID:${Date.now()}${Math.random().toString(36).slice(2)}@feirasvp\r\n`;
    ics += dtStartLine + "\r\n" + dtEndLine + "\r\n";
    ics += `SUMMARY:${icsEscape(e.title)}\r\n`;
    if(e.location) ics += `LOCATION:${icsEscape(e.location)}\r\n`;
    if(e.details) ics += `DESCRIPTION:${icsEscape(e.details)}\r\n`;
    ics += "END:VEVENT\r\n";
  });
  ics += "END:VCALENDAR\r\n";
  return ics;
}
function downloadICS(filename, events){
  if(!events.length) return;
  const blob = new Blob([buildICS(events)], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function entriesFor(cidade, dia){

      const matchesDia = !dia || f[0]===dia || (f[0]==="Segunda-feira" && dia!=="Domingo");

    const chosen = allSel[parseInt(selFeiraIdx)];

function diasDisponiveis(cidade){
  if(!cidade) return WEEKDAY_NAMES.slice();
  const set = new Set();
  feirasPorCidade[cidade].forEach(f=>{
    if(f[0]==="Segunda-feira"){ WEEKDAY_NAMES.slice(1).forEach(d=>set.add(d)); }

  });
  return WEEKDAY_NAMES.filter(d=>set.has(d));
}

function buildCalendar(){
  document.getElementById('monthLabel').innerHTML = `${MESES[viewMonth]} <span class="yr" id="yearLabel">${viewYear}</span>`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = "";

  const first = new Date(viewYear, viewMonth, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();

  const cells = [];
  for(let i=startWeekday-1;i>=0;i--){ cells.push({d:prevMonthDays-i, out:true, dir:-1}); }
  for(let d=1; d<=daysInMonth; d++){ cells.push({d, out:false, dir:0}); }
  let nextD = 1;
  while(cells.length < 42){ cells.push({d:nextD++, out:true, dir:1}); }

  const monthCitiesUsed = new Set();
  let monthHasAnyReg = false;

  cells.forEach(c=>{
    let realMonth = viewMonth, realYear = viewYear;
    if(c.dir===-1){ realMonth = viewMonth-1; realYear = viewYear; if(realMonth<0){realMonth=11; realYear--;} }
    else if(c.dir===1){ realMonth = viewMonth+1; realYear = viewYear; if(realMonth>11){realMonth=0; realYear++;} }

    const dateObj = new Date(realYear, realMonth, c.d);
    const wd = dateObj.getDay();
    const isToday = sameDay(dateObj, hoje);
    const isSelected = sameDay(dateObj, selectedDate);

    const cell = document.createElement('div');
    cell.className = "day" + (c.out?" out":"") + (wd===0?" we":"") + (wd===6?" sa":"") + (isToday?" today":"") + (isSelected && !c.out?" selected":"");

    let html = `<span class="n">${c.d}</span>`;

    if(!c.out){
      let dayRegs = getDayRegsSync(realYear, realMonth, c.d);
      if(selCidade){ dayRegs = dayRegs.filter(r=> r.cidade === selCidade); }
      if(selDia && weekdayNameFromDate(dateObj) !== selDia){ dayRegs = []; }

      if(dayRegs.length){
        dayRegs.forEach(r=>{ if(r.cidade){ monthCitiesUsed.add(r.cidade); } });
        monthHasAnyReg = true;

        if(selCidade){
          const shown = dayRegs.slice(0,3);
          html += `<div class="badges">` + shown.map(r=>{
            const cor = r.cidade ? corHex[r.cidade] : '#B5680B';
            const txt = `${r.titulo||''}${r.horario?" · "+r.horario:""}`;
            return `<div class="badge" style="border-left-color:${cor}">${txt}</div>`;
          }).join("") + `</div>`;
          if(dayRegs.length>3){ html += `<div class="more">+${dayRegs.length-3} registro(s)</div>`; }
        } else {
          const cidadeColors = [...new Set(dayRegs.filter(r=>r.cidade).map(r=>corHex[r.cidade]))];
          const hasNoCityReg = dayRegs.some(r=>!r.cidade);
          const dotColors = hasNoCityReg ? [...cidadeColors, '#B5680B'] : cidadeColors;
          const shown = dotColors.slice(0,3);
          html += `<div class="dots">` + shown.map(col=>`<span class="dot" style="background:${col}"></span>`).join("") +
            (dotColors.length>3 ? `<span class="more">+${dotColors.length-3}</span>` : "") + `</div>`;
        }
      }
    }

    cell.innerHTML = html;
    if(!c.out){
      cell.addEventListener('click', ()=>{
        const wasAlreadySelected = sameDay(dateObj, selectedDate);
        selectedDate = dateObj;
        buildCalendar();
        renderAgendaDia();
        if(wasAlreadySelected){
          openDay(dateObj);
        } else {
          const anchor = document.getElementById('agendaDiaTitle');
          if(anchor){ anchor.scrollIntoView({behavior:'smooth', block:'start'}); }
        }
      });
    }
    grid.appendChild(cell);
  });

  renderLegend(monthCitiesUsed, monthHasAnyReg);
}

function renderLegend(monthCitiesUsed, monthHasAnyReg){
  const legend = document.getElementById('legend');
  let cidadesToShow = [...monthCitiesUsed].sort();
  if(selCidade){ cidadesToShow = cidadesToShow.filter(c=>c===selCidade); }
  if(!cidadesToShow.length){
    legend.innerHTML = `<div class="empty-note-sm">${monthHasAnyReg ? "Nenhum registro com cidade definida neste mês." : "Nenhum registro cadastrado neste mês ainda. Toque em um dia para começar."}</div>`;
    return;
  }
  legend.innerHTML = cidadesToShow.map(c=>`<div class="lg"><span class="dot" style="background:${corHex[c]}"></span>${c}</div>`).join("");
}

function renderAgendaDia(){
  const title = document.getElementById('agendaDiaTitle');
  const isToday = sameDay(selectedDate, hoje);
  title.textContent = isToday ? "Agenda do dia" : `Agenda — ${selectedDate.getDate()}/${selectedDate.getMonth()+1}`;

  const feiras = feirasForDate(selectedDate);
  const y=selectedDate.getFullYear(), m=selectedDate.getMonth(), d=selectedDate.getDate();

  loadDayRegs(y,m,d).then(regs=>{
    const list = document.getElementById('agendaDiaList');
    if(!feiras.length && !regs.length){
      list.innerHTML = `<div class="empty-note">Nenhuma feira ou registro para esse dia.</div>`;
      return;
    }
    const items = [];
    feiras.slice(0,6).forEach(e=>items.push(renderAgCard(selectedDate, e, null)));
    regs.forEach(r=>items.push(renderAgCard(selectedDate, null, r)));
    list.innerHTML = items.join("");
    list.querySelectorAll('.ag-card').forEach(el=>{
      el.addEventListener('click', ()=> openDay(selectedDate));

let agendaMonthIdx = 0;
function getAgendaMonths(){
  const months = [];
  for(let i=0;i<3;i++){
    let m = hoje.getMonth()+i, y = hoje.getFullYear();
    while(m>11){ m-=12; y++; }
    months.push({y, m});
  }
  return months;
}
function renderAgendaMonthTabs(){
  const wrap = document.getElementById('agendaMonthTabs');
  const months = getAgendaMonths();
  wrap.innerHTML = months.map((mo,i)=>`<button data-idx="${i}" class="${i===agendaMonthIdx?'active':''}">${MESES[mo.m]}</button>`).join("");
  wrap.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      agendaMonthIdx = parseInt(btn.dataset.idx);
      renderAgendaFull();
    });
  });
}

async function renderAgendaFull(){
  renderAgendaMonthTabs();
  const list = document.getElementById('agendaFullList');
  list.innerHTML = `<div class="loading-txt">Carregando…</div>`;

  const months = getAgendaMonths();
  const {y, m} = months[agendaMonthIdx];
  const isCurrentMonth = (y===hoje.getFullYear() && m===hoje.getMonth());
  const start = isCurrentMonth ? new Date(hoje) : new Date(y, m, 1);
  const end = new Date(y, m+1, 0);

  const regsByDay = await loadRegsForRange(start,end);
  const dates = eachDate(start,end);

  const blocks = [];
  const dateForCard = [];
  dates.forEach(d=>{
    const yy=d.getFullYear(), mm=d.getMonth(), dd=d.getDate();
    let regs = regsByDay[`${yy}-${mm}-${dd}`] || [];
    if(selCidade){ regs = regs.filter(r=> r.cidade === selCidade); }
    if(selDia && weekdayNameFromDate(d) !== selDia){ regs = []; }
    if(!regs.length) return;
    const items = regs.map(r=>{ dateForCard.push(d); return renderAgCard(d, null, r); });
    blocks.push(`<div class="rep-day-head">${fmtDateLabel(d)}</div>${items.join("")}`);
  });

  list.innerHTML = blocks.length ? blocks.join("") : `<div class="empty-note">Nenhum registro cadastrado em ${MESES[m].toLowerCase()}${selCidade? " para "+selCidade:""}. Toque em um dia no Calendário e use "+ Novo registro".</div>`;
  list.querySelectorAll('.ag-card').forEach((el,i)=>{
    el.addEventListener('click', ()=>{ const d=dateForCard[i]; if(d) openDay(d); });
  });
}

function countAgendamentosPorCidade(){
  const counts = {};
  CIDADES.forEach(c=>counts[c]=0);
  const scanArr = (arr)=>{ if(Array.isArray(arr)){ arr.forEach(r=>{ if(r && r.cidade && counts.hasOwnProperty(r.cidade)){ counts[r.cidade]++; } }); } };
  if(lsAvailable()){
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('evt:')===0){
        try{ const v = localStorage.getItem(k); if(v){ scanArr(JSON.parse(v)); } }catch(e){}
      }
    }
  }
  Object.keys(memStore).forEach(k=>{ if(k.indexOf('evt:')===0){ scanArr(memStore[k]); } });
  return counts;
}

  const list = document.getElementById('cidadesList');

function getCustomLocais(cidade){
  try{
    const v = localStorage.getItem('customLocais:'+cidade);
    return v ? JSON.parse(v) : [];
  }catch(e){ return []; }
}
function saveCustomLocal(cidade, dia, horario, nome, endereco){
  const key = 'customLocais:'+cidade;
  let arr = getCustomLocais(cidade);
  arr.push([dia, horario, nome, endereco]);
  try{ localStorage.setItem(key, JSON.stringify(arr)); return true; }catch(e){ return false; }
}
function refreshFeiraOptions(){
  const ref = document.getElementById('fFeiraRef');
  const cidade = document.getElementById('fCidade').value;
  const busca = document.getElementById('fBuscaLocal').value.trim().toLowerCase();
  const btnIncluir = document.getElementById('btnIncluirLocal');
  if(btnIncluir){ btnIncluir.style.display = cidade ? "inline-block" : "none"; }

  let list = [];
  if(cidade){
    list = entriesFor(cidade, "").slice();
    getCustomLocais(cidade).forEach(c=>{
      list.push({cidade, dia:c[0], horario:c[1], bairro:c[2]+" (seu cadastro)", endereco:c[3]});
    });
  } else if(busca){
    list = entriesFor("", "").slice();
    CIDADES.forEach(c=> getCustomLocais(c).forEach(cu=>{
      list.push({cidade:c, dia:cu[0], horario:cu[1], bairro:cu[2]+" (seu cadastro)", endereco:cu[3]});
    }));
  }
  if(busca){ list = list.filter(e => (e.bairro+" "+(e.endereco||"")+" "+e.cidade).toLowerCase().includes(busca)); }
  window.__feiraOptions = list;

  if(!cidade && !busca){
    ref.innerHTML = '<option value="">Escolha uma cidade acima (ou busque pelo nome do local)</option>';
  } else if(!list.length){
    ref.innerHTML = '<option value="">Nenhuma feira encontrada — use "+ Incluir local" para cadastrar</option>';
  } else {
    ref.innerHTML = '<option value="">— selecionar feira —</option>' + list.map((e,i)=>{
      const diaAbrev = (e.dia||"").replace("-feira","");
      const prefix = cidade ? diaAbrev+" — " : e.cidade+" — "+diaAbrev+" — ";
      return `<option value="${i}">${prefix}${e.bairro} (${e.horario})</option>`;
    }).join("");
  }
  ref.onchange = ()=>{
    if(ref.value===""){return;}
    const e = window.__feiraOptions[parseInt(ref.value)];
    document.getElementById('fCidade').value = e.cidade;
    document.getElementById('fTitulo').value = `Ir à feira — ${e.bairro}`;
    document.getElementById('fHorario').value = e.horario;
    document.getElementById('fLocal').value = `${e.bairro}${e.endereco?", "+e.endereco:""} — ${e.cidade}`;
  };
}
function popRegiaoCampanha(){
  const selR = document.getElementById('fRegiaoCampanha');
  selR.innerHTML = '<option value="">Região / cidade</option>' + REGIOES_CAMPANHA.map(r=>`<option value="${r}">${r}</option>`).join("");
  selR.onchange = ()=> popLocalCampanha(selR.value);

function popLocalCampanha(regiao){
  const selL = document.getElementById('fLocalCampanha');
  const busca = document.getElementById('fBuscaLocal').value.trim().toLowerCase();
  if(!regiao && !busca){ selL.innerHTML = '<option value="">Local</option>'; selL.onchange = null; window.__campanhaOptions = []; return; }

  let pontos = [];
  if(regiao){
    pontos = (pontosCampanha[regiao]||[]).map(p=>({p, regiao}));
  } else if(busca){
    REGIOES_CAMPANHA.forEach(r=>{ (pontosCampanha[r]||[]).forEach(p=> pontos.push({p, regiao:r})); });
  }
  if(busca){ pontos = pontos.filter(x => (x.p[0]+" "+x.p[1]).toLowerCase().includes(busca)); }
  window.__campanhaOptions = pontos;

  if(!pontos.length){
    selL.innerHTML = '<option value="">Nenhum local encontrado</option>';
    selL.onchange = null;
    return;
  }
  selL.innerHTML = '<option value="">Local</option>' + pontos.map((x,i)=>`<option value="${i}">${regiao ? "" : x.regiao+" — "}${x.p[0]}</option>`).join("");
  selL.onchange = ()=>{
    if(selL.value===""){return;}
    const x = window.__campanhaOptions[parseInt(selL.value)];
    document.getElementById('fTitulo').value = `Ponto de campanha — ${x.p[0]}`;
    document.getElementById('fHorario').value = x.p[2];
    document.getElementById('fLocal').value = `${x.p[1]} — ${x.regiao}`;
    document.getElementById('fObs').value = x.p[3] || "";
    if(!regiao){ document.getElementById('fRegiaoCampanha').value = x.regiao; }
  };
}

async function handleSalvar(){
  const msg = document.getElementById('formMsg');
  try{
    const titulo = document.getElementById('fTitulo').value.trim();
    if(!titulo){ msg.textContent = "Dê um título ao registro."; msg.className = "form-msg err"; return; }
    if(!selectedDate){ msg.textContent = "Selecione um dia no calendário primeiro."; msg.className = "form-msg err"; return; }
    const entry = {
      id: editingId || ('r'+Date.now()+Math.random().toString(36).slice(2,7)),
      tipo: document.getElementById('fTipo').value,
      cidade: document.getElementById('fCidade').value,
      titulo,
      horario: document.getElementById('fHorario').value.trim(),
      pessoa: document.getElementById('fPessoa').value.trim(),
      local: document.getElementById('fLocal').value.trim(),
      email: document.getElementById('fEmail').value.trim(),
      obs: document.getElementById('fObs').value.trim(),
    };
    const y = selectedDate.getFullYear(), m = selectedDate.getMonth(), d = selectedDate.getDate();
    if(editingId){ currentDayRegs = currentDayRegs.map(r=> r.id===editingId ? entry : r); }
    else { currentDayRegs = [...currentDayRegs, entry]; }
    msg.textContent = "Salvando…"; msg.className = "form-msg";
    const ok = await saveDayRegs(y,m,d,currentDayRegs);
    if(ok){
      msg.textContent = "Registro salvo."; msg.className = "form-msg ok";
      await refreshRegistros();
      buildCalendar(); renderAgendaDia();
      resetForm();
    } else {
      msg.textContent = "Não foi possível salvar."; msg.className = "form-msg err";
    }
  }catch(err){
    console.error('Erro ao salvar registro:', err);
    msg.textContent = "Erro inesperado ao salvar. Veja o console para detalhes.";
    msg.className = "form-msg err";
  }
}

function printDayAgenda(){
  const wd = weekdayNameFromDate(selectedDate);
  const allDay = entriesFor("", "").filter(e=>e.dia===wd);
  const feirasHtml = allDay.length ? allDay.map(e=>`
    <div class="pa-row"><div class="pa-h">${e.horario}</div><div class="pa-b"><strong>${e.cidade} — ${e.bairro}</strong>${e.endereco?`<span>${e.endereco}</span>`:""}</div></div>
  `).join("") : `<div class="pa-empty">Nenhuma feira oficial nesse dia.</div>`;
  const tipoLabel = {feira:"Feira", campanha:"Campanha", reuniao:"Reunião", outro:"Outro"};
  const regsHtml = currentDayRegs.length ? currentDayRegs.map(r=>`
    <div class="pa-row"><div class="pa-h">${r.horario||"—"}</div>
      <div class="pa-b"><strong>[${tipoLabel[r.tipo]||"Outro"}] ${r.titulo}</strong>
      ${r.pessoa?`<span>Com: ${r.pessoa}</span>`:""}${r.local?`<span>Local: ${r.local}</span>`:""}${r.email?`<span>Convidados: ${r.email}</span>`:""}${r.obs?`<span>${r.obs}</span>`:""}</div></div>
  `).join("") : `<div class="pa-empty">Nenhum registro seu para esse dia.</div>`;
  document.getElementById('printArea').innerHTML = `
    <div class="pa-page">
      <div class="pa-title">Agenda do dia</div>
      <div class="pa-sub">${fmtDateLabel(selectedDate)}</div>
      <h5 style="font-family:'IBM Plex Mono',monospace;color:#0B57E0;">Feiras livres</h5>${feirasHtml}
      <h5 style="font-family:'IBM Plex Mono',monospace;color:#0B57E0;">Compromissos e registros</h5>${regsHtml}
    </div>`;
  window.print();
}

function getRangeDates(type){
  const today = new Date(hoje);
  let start, end;
  if(type==='week'){ const dow=today.getDay(); start=new Date(today); start.setDate(today.getDate()-dow); end=new Date(start); end.setDate(start.getDate()+6); }
  else if(type==='month'){ start=new Date(viewYear, viewMonth, 1); end=new Date(viewYear, viewMonth+1, 0); }
  else if(type==='60days'){ start=new Date(today); end=new Date(today); end.setDate(today.getDate()+60); }
  else if(type==='augoct'){ start=new Date(2026,7,1); end=new Date(2026,9,31); }
  return {start,end};
}
function filterNoteText(){
  const parts = [selCidade?`Cidade: ${selCidade}`:"Cidade: todas", selDia?`Dia: ${selDia}`:"Dia: todos"];
  if(selFeiraIdx !== ""){ const list=entriesFor(selCidade,selDia); const chosen=list[parseInt(selFeiraIdx)]; if(chosen) parts.push(`Feira: ${chosen.bairro}`); }
  return "Filtro atual — " + parts.join(" · ");
}
let currentReport = {type:null, start:null, end:null, grouped:[]};
async function buildReport(type){
  document.querySelectorAll('.rep-presets button').forEach(b=>b.classList.toggle('active', b.dataset.range===type));
  document.getElementById('reportFilterNote').textContent = filterNoteText();
  const body = document.getElementById('reportBody');
  body.innerHTML = `<div class="loading-txt">Carregando período…</div>`;
  const {start,end} = getRangeDates(type);
  const dates = eachDate(start,end);
  const regsByDay = await loadRegsForRange(start,end);
  const grouped = [];
  dates.forEach(d=>{
    const y=d.getFullYear(), m=d.getMonth(), dd=d.getDate();
    const feiras = feirasForDate(d);
    const regs = regsByDay[`${y}-${m}-${dd}`] || [];
    if(feiras.length || regs.length) grouped.push({date:d, feiras, regs});
  });
  currentReport = {type, start, end, grouped};
  if(!grouped.length){ body.innerHTML = `<div class="empty-note">Nada encontrado nesse período com o filtro atual.</div>`; return; }
  body.innerHTML = grouped.map(g=>`
    <div class="rep-day-head">${fmtDateLabel(g.date)}</div>
    ${g.feiras.map(e=>renderAgCard(g.date,e,null)).join("")}
    ${g.regs.map(r=>renderAgCard(g.date,null,r)).join("")}
  `).join("");
}
function printReport(){
  if(!currentReport.grouped.length) return;
  const labelMap = {week:"Agenda da semana", month:"Agenda do mês", "60days":"Agenda — próximos 60 dias", augoct:"Agenda — agosto a outubro de 2026"};
  const title = labelMap[currentReport.type] || "Agenda";
  const sub = `${currentReport.start.getDate()}/${currentReport.start.getMonth()+1}/${currentReport.start.getFullYear()} a ${currentReport.end.getDate()}/${currentReport.end.getMonth()+1}/${currentReport.end.getFullYear()}`;
  const tipoLabel = {feira:"Feira", campanha:"Campanha", reuniao:"Reunião", outro:"Outro"};
  const blocks = currentReport.grouped.map(g=>`
    <div class="pa-day-block"><h6>${fmtDateLabel(g.date)}</h6>
      ${g.feiras.map(e=>`<div class="pa-row"><div class="pa-h">${e.horario}</div><div class="pa-b"><strong>${e.cidade} — ${e.bairro}</strong>${e.endereco?`<span>${e.endereco}</span>`:""}</div></div>`).join("")}
      ${g.regs.map(r=>`<div class="pa-row"><div class="pa-h">${r.horario||"—"}</div><div class="pa-b"><strong>[${tipoLabel[r.tipo]||"Outro"}] ${r.titulo}</strong>${r.pessoa?`<span>Com: ${r.pessoa}</span>`:""}${r.local?`<span>Local: ${r.local}</span>`:""}${r.obs?`<span>${r.obs}</span>`:""}</div></div>`).join("")}
    </div>`).join("");
  document.getElementById('printArea').innerHTML = `<div class="pa-page"><div class="pa-title">${title}</div><div class="pa-sub">${sub} — ${filterNoteText()}</div>${blocks}</div>`;
  window.print();
}

function switchView(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  if(view==='agenda') renderAgendaFull();
  if(view==='cidades') renderCidades();
}

document.getElementById('selCidade').addEventListener('change', e=>{ selCidade=e.target.value; popDia(); popFeira(); buildCalendar(); renderAgendaDia(); });
document.getElementById('selDia').addEventListener('change', e=>{ selDia=e.target.value; popFeira(); buildCalendar(); renderAgendaDia(); });

document.getElementById('btnSalvarNovoLocal').addEventListener('click', ()=>{
  const cidade = document.getElementById('fCidade').value;
  if(!cidade){ alert('Escolha uma cidade acima antes de incluir um local.'); return; }
  const nome = document.getElementById('novoLocalNome').value.trim();
  if(!nome){ alert('Dê um nome ao local.'); return; }
  const endereco = document.getElementById('novoLocalEndereco').value.trim();
  const dia = document.getElementById('novoLocalDia').value;
  const horario = document.getElementById('novoLocalHorario').value.trim() || 'Não informado';
  const ok = saveCustomLocal(cidade, dia, horario, nome, endereco);
  if(ok){
    document.getElementById('incluirLocalBox').style.display = 'none';
    document.getElementById('novoLocalNome').value = '';
    document.getElementById('novoLocalEndereco').value = '';
    document.getElementById('novoLocalHorario').value = '';
    refreshFeiraOptions();
    alert('Local incluído! Já aparece na lista de feiras dessa cidade.');
  } else {
    alert('Não foi possível salvar o local.');
  }
});

document.getElementById('btnCancelEdit').addEventListener('click', resetForm);

document.getElementById('printReportBtn').addEventListener('click', printReport);
document.getElementById('btnExportICS').addEventListener('click', ()=>{
  if(!currentReport.grouped.length){ alert("Escolha um período do relatório primeiro."); return; }
  const tipoLabel = {feira:"Feira", campanha:"Campanha", reuniao:"Reunião", outro:"Outro"};
  const events = [];
  currentReport.grouped.forEach(g=>{
    g.feiras.forEach(e=>{
      events.push({
        title: `Feira — ${e.bairro} (${e.cidade})`,
        dateObj: g.date, horario: e.horario,
        location: `${e.bairro}${e.endereco?", "+e.endereco:""} — ${e.cidade}`,
        details: `Feira livre em ${e.cidade}.`
      });
    });
    g.regs.forEach(r=>{
      events.push({
        title: `[${tipoLabel[r.tipo]||"Outro"}] ${r.titulo}`,
        dateObj: g.date, horario: r.horario,
        location: r.local||'',
        details: [r.pessoa?`Com: ${r.pessoa}`:'', r.obs||''].filter(Boolean).join(' — ')
      });
    });
  });
  const labelMap = {week:"semana", month:"mes", "60days":"60dias", augoct:"ago-out-2026"};
  downloadICS(`agenda-feiras-${labelMap[currentReport.type]||"periodo"}.ics`, events);
});

document.getElementById('btnLimparTudo').addEventListener('click', ()=>{
  const step1 = window.confirm("Isso vai apagar TODOS os seus registros salvos (reuniões, campanha, visitas etc.) neste navegador. As feiras oficiais não são afetadas. Não pode ser desfeito. Continuar?");
  if(!step1) return;
  const step2 = window.confirm("Tem certeza mesmo? Todos os registros cadastrados serão perdidos permanentemente.");
  if(!step2) return;
  try{
    const toRemove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('evt:')===0) toRemove.push(k);
    }
    toRemove.forEach(k=>localStorage.removeItem(k));
  }catch(e){ console.error('Erro ao limpar localStorage:', e); }
  Object.keys(memStore).forEach(k=>delete memStore[k]);
  currentReport = {type:null, start:null, end:null, grouped:[]};
  document.getElementById('reportBody').innerHTML = `<div class="loading-txt">Selecione um período acima.</div>`;
  document.querySelectorAll('.rep-presets button').forEach(b=>b.classList.remove('active'));
  buildCalendar();
  renderAgendaDia();
  alert("Todos os registros foram apagados. Você pode cadastrar tudo do zero.");
});

buildCalendar();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
